<header class="flex justify-between items-center p-4  bg-transparent absolute w-full z-50 dir-rtl">
    <div class="logo font-bold text-xl md:text-2xl tracking-widest text-blue-400">AURA MEDIA - הולגרמה ישראל </div>

    <nav class="hidden lg:flex gap-8 items-center text-sm font-medium text-white/90">
        <a href="/home" class="hover:text-blue-400 transition">
            בית
        </a>
        <a href="/business-solutions" class="hover:text-blue-400 transition">
            פתרונות לעסקים
        </a>
        <a href="/advantages" class="hover:text-blue-400 transition">
            היתרונות
        </a>
        <a href="/faq" class="hover:text-blue-400 transition">
            שאלות נפוצות
        </a>
        <a href="/contact-us" class="hover:text-blue-400 transition">
            צרו קשר
        </a>
    </nav>

    <div class="flex items-center gap-3 md:gap-4">
        <a href="tel:0525833319"
            class="flex items-center gap-2 border border-yellow-500/50 text-yellow-500 px-3 py-1.5 md:px-4 md:py-2 rounded-lg hover:bg-yellow-500 hover:text-black transition-all">
            <span class="text-[10px] md:text-xs font-bold">052-6833319</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
        </a>

        <button (click)="toggleMenu()" class="lg:hidden text-white p-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <button class="hidden sm:block bg-gold-gradient px-4 py-2 rounded-lg text-black font-bold text-sm shadow-lg">
            קבל הדגמה
        </button>
    </div>

    @if (isMenuOpen()) {
    <div class="fixed inset-0 bg-[#050a14]/95  flex flex-col items-center justify-center space-y-8 animate-fade-in">
        <button (click)="toggleMenu()" class="absolute top-6 right-6 text-white p-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <a href="#" (click)="toggleMenu()" class="text-2xl font-bold hover:text-blue-400">בית</a>
        <a href="#" (click)="toggleMenu()" class="text-2xl font-bold hover:text-blue-400">פתרונות לעסקים</a>
        <a href="#" (click)="toggleMenu()" class="text-2xl font-bold hover:text-blue-400">היתרונות</a>
        <a href="#" (click)="toggleMenu()" class="text-2xl font-bold hover:text-blue-400">שאלות נפוצות</a>
        <a href="#" (click)="toggleMenu()" class="text-2xl font-bold hover:text-blue-400">צרו קשר</a>

        <button class="bg-gold-gradient px-8 py-3 rounded-lg text-black font-bold text-xl shadow-lg mt-4">
            קבל הדגמה עכשיו
        </button>
    </div>
    }
</header>
